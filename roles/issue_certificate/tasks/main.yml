---
# issue_certificate: Request a leaf certificate from a running step-ca instance.
#
# Responsibilities (per design):
#   1. Validate caller-supplied CN/SANs, provisioner password, CA URL, and fingerprint are present
#   2. Request a leaf certificate via step CLI
#   3. Return cert, key, and chain as Ansible facts (no_log on secret material)
#   4. Return cert-expiry facts: step_ca_issue_certificate_not_after and _days_remaining (public)
#   5. Optionally write cert/key/chain to caller-supplied paths (consumer's choice)
#
# Constraints:
#   - Fail-fast asserts on required inputs before any API call
#   - No_log on provisioner password and issued private key
#   - Single issuance per invocation (no retry-as-secret-bypass, no silent fallback)
#   - No include_role / import_role of other blueprints.* collections
#   - All inputs from caller-supplied variables; no external discovery or retrieval
#   - No hardcoded CA hostnames or provisioner configuration

- name: Assert required inputs are supplied by the caller
  ansible.builtin.assert:
    that:
      - step_ca_issue_ca_url | length > 0
      - step_ca_issue_ca_fingerprint | length > 0
      - step_ca_issue_provisioner_password | length > 0
      - step_ca_issue_certificate_common_name | length > 0
    fail_msg: |
      Required inputs missing for certificate issuance:
        - step_ca_issue_ca_url: HTTPS URL to the step-ca CA API (e.g. 'https://step-ca.local:443')
        - step_ca_issue_ca_fingerprint: SHA-256 fingerprint of the root certificate (for TOFU bootstrap)
        - step_ca_issue_provisioner_password: Secret password for the JWK provisioner
        - step_ca_issue_certificate_common_name: CN for the leaf certificate (e.g. 'vault.local')
    success_msg: "Required inputs present (CA URL + fingerprint + provisioner password + CN)."
  no_log: false
  tags:
    - issue_certificate

- name: Validate SANs format (must be a list)
  ansible.builtin.assert:
    that:
      - step_ca_issue_certificate_subject_alt_names is defined
      - step_ca_issue_certificate_subject_alt_names is iterable
    fail_msg: "step_ca_issue_certificate_subject_alt_names must be a list (can be empty)."
  tags:
    - issue_certificate

- name: Test CA connectivity via health endpoint
  ansible.builtin.uri:
    url: "{{ step_ca_issue_ca_url }}/health"
    method: GET
    validate_certs: false
    ca_path: "/etc/ssl/certs/ca-certificates.crt"
  register: ca_health_check
  tags:
    - issue_certificate

- name: Create temporary directory for certificate generation
  ansible.builtin.tempfile:
    state: directory
    suffix: _step_ca
  register: temp_cert_dir
  tags:
    - issue_certificate

- name: Issue leaf certificate from step-ca
  ansible.builtin.shell: |
    set -o pipefail
    export LC_ALL=C.UTF-8
    export STEPPATH="{{ temp_cert_dir.path }}/step"
    # 'step ca certificate' has no --ca-fingerprint/--ca-url flags at all
    # (confirmed via --help) -- TOFU trust establishment is a separate
    # command, 'step ca bootstrap', which writes the CA URL/root cert/
    # fingerprint to $STEPPATH/config/defaults.json. After bootstrap,
    # 'ca' commands need no further CA-related flags. Using a scoped
    # STEPPATH (not the real one) keeps this idempotent/side-effect-free
    # across repeated role invocations.
    step ca bootstrap \
      --ca-url "{{ step_ca_issue_ca_url }}" \
      --fingerprint "{{ step_ca_issue_ca_fingerprint }}" \
      --force
    step ca certificate \
      --provisioner-password-file=/dev/stdin \
      --not-after "{{ step_ca_issue_certificate_validity_days * 24 }}h" \
      {% for san in step_ca_issue_certificate_subject_alt_names %}\
      --san "{{ san }}" \
      {% endfor %}\
      "{{ step_ca_issue_certificate_common_name }}" \
      "{{ temp_cert_dir.path }}/cert.pem" \
      "{{ temp_cert_dir.path }}/key.pem"
  args:
    executable: /bin/bash
    stdin: "{{ step_ca_issue_provisioner_password }}"
  no_log: true
  changed_when: true
  tags:
    - issue_certificate

- name: Read issued certificate
  ansible.builtin.slurp:
    src: "{{ temp_cert_dir.path }}/cert.pem"
  register: cert_content
  tags:
    - issue_certificate

- name: Read issued private key
  ansible.builtin.slurp:
    src: "{{ temp_cert_dir.path }}/key.pem"
  register: key_content
  no_log: true
  tags:
    - issue_certificate

- name: Set certificate fact
  ansible.builtin.set_fact:
    step_ca_issue_certificate_pem: "{{ cert_content.content | b64decode }}"
  tags:
    - issue_certificate

- name: Set private key fact
  ansible.builtin.set_fact:
    step_ca_issue_certificate_key_pem: "{{ key_content.content | b64decode }}"
  no_log: true
  tags:
    - issue_certificate

- name: Extract certificate expiry dates
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in "{{ temp_cert_dir.path }}/cert.pem" -noout -dates
  args:
    executable: /bin/bash
  register: cert_dates
  changed_when: false
  tags:
    - issue_certificate

- name: Parse certificate expiry information
  ansible.builtin.set_fact:
    step_ca_issue_certificate_not_after: "{{ (cert_dates.stdout_lines | select('match', '^notAfter=') | first).split('=')[1] }}"
  tags:
    - issue_certificate

- name: Calculate days remaining until certificate expiry
  ansible.builtin.set_fact:
    step_ca_issue_certificate_days_remaining: "{{ ((cert_dates.stdout_lines | select('match', '^notAfter=') | first).split('=')[1] | to_datetime('%b %d %H:%M:%S %Y %Z') - now(utc=true)).days }}"
  tags:
    - issue_certificate

- name: Optionally write certificate to output path
  ansible.builtin.copy:
    content: "{{ step_ca_issue_certificate_pem }}"
    dest: "{{ step_ca_issue_certificate_output_cert_path }}"
    mode: "0644"
  when: step_ca_issue_certificate_output_cert_path | length > 0
  tags:
    - issue_certificate

- name: Optionally write private key to output path
  ansible.builtin.copy:
    content: "{{ step_ca_issue_certificate_key_pem }}"
    dest: "{{ step_ca_issue_certificate_output_key_path }}"
    mode: "0600"
  no_log: true
  when: step_ca_issue_certificate_output_key_path | length > 0
  tags:
    - issue_certificate

- name: Optionally write certificate chain to output path
  ansible.builtin.copy:
    content: "{{ step_ca_issue_certificate_pem }}\n"
    dest: "{{ step_ca_issue_certificate_output_chain_path }}"
    mode: "0644"
  when: step_ca_issue_certificate_output_chain_path | length > 0
  tags:
    - issue_certificate

- name: Clean up temporary certificate directory
  ansible.builtin.file:
    path: "{{ temp_cert_dir.path }}"
    state: absent
  tags:
    - issue_certificate

- name: Issue certificate convergence complete
  ansible.builtin.debug:
    msg: |
      issue_certificate role complete.
      Leaf certificate issued and facts exposed to caller.
        - step_ca_issue_certificate_pem: Certificate (PEM)
        - step_ca_issue_certificate_key_pem: Private key (PEM, secret)
        - step_ca_issue_certificate_not_after: Expiry time (ISO8601)
        - step_ca_issue_certificate_days_remaining: Days until expiry
  tags:
    - issue_certificate
