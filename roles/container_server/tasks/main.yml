---
# container_server: Initialize and run step-ca as a container.
#
# Responsibilities (per design):
#   1. Assert required inputs (image, provisioner password) are supplied by the caller
#   2. Create/own a dedicated service user and data directory with restrictive permissions
#   3. Render ca.json (step-ca's config) from caller-supplied variables
#   4. Generate root key/cert pair (or accept caller-supplied pair in future FR-1 implementation)
#   5. Configure the default JWK provisioner from the provisioner password
#   6. Start/restart the container via community.docker.docker_container
#   7. Expose the root cert (not the key) as Ansible facts for the platform layer to consume
#   8. Return the CA fingerprint as a fact (public, not secret) for TOFU-based client bootstrap
#
# Constraints:
#   - Idempotence-first: use community.docker.docker_container in declarative mode
#   - No_log on any task handling the provisioner password
#   - Fail-fast asserts on required inputs before any container starts
#   - No include_role / import_role of other blueprints.* collections
#   - All configuration from caller-supplied variables; no external retrieval

- name: Assert required inputs are supplied by the caller
  ansible.builtin.assert:
    that:
      - step_ca_server_image | length > 0
      - step_ca_server_provisioner_password | length > 0
    fail_msg: |
      Required inputs missing:
        - step_ca_server_image: Container image reference (caller-supplied; no org default). Example: 'smallstep/step-ca:0.27.0'
        - step_ca_server_provisioner_password: Secret password for the default JWK provisioner (fail-fast if missing).
    success_msg: "Required inputs present (image + provisioner password)."
  no_log: false
  tags:
    - container_server

- name: Ensure service group exists
  ansible.builtin.group:
    name: "{{ step_ca_server_service_group }}"
    gid: "{{ step_ca_server_gid | default(omit, true) }}"
    system: true
    state: present
  register: step_ca_server_group_result
  tags:
    - container_server

- name: Ensure service user exists
  ansible.builtin.user:
    name: "{{ step_ca_server_service_user }}"
    uid: "{{ step_ca_server_uid | default(omit, true) }}"
    group: "{{ step_ca_server_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  register: step_ca_server_user_result
  tags:
    - container_server

- name: Capture the actual uid/gid assigned (whether fixed or OS-allocated)
  ansible.builtin.set_fact:
    step_ca_server_actual_uid: "{{ step_ca_server_user_result.uid }}"
    step_ca_server_actual_gid: "{{ step_ca_server_group_result.gid }}"
  tags:
    - container_server

- name: Create data directory with restrictive permissions
  ansible.builtin.file:
    path: "{{ step_ca_server_data_dir }}"
    state: directory
    owner: "{{ step_ca_server_service_user }}"
    group: "{{ step_ca_server_service_group }}"
    mode: "0700"
  tags:
    - container_server

- name: Check if root CA certificate already exists (idempotence check)
  ansible.builtin.stat:
    path: "{{ step_ca_server_data_dir }}/root_ca.crt"
  register: root_ca_cert_stat
  tags:
    - container_server

- name: Generate root CA key and certificate (if not already present)
  ansible.builtin.shell: |
    set -e
    openssl req -new -x509 -days 3650 -nodes \
      -out "{{ step_ca_server_data_dir }}/root_ca.crt" \
      -keyout "{{ step_ca_server_data_dir }}/root_ca.key" \
      -subj "/C=US/ST=State/L=City/O={{ step_ca_server_root_ca_organization }}/CN={{ step_ca_server_root_ca_cn }}"
    chmod 600 "{{ step_ca_server_data_dir }}/root_ca.key"
    chmod 644 "{{ step_ca_server_data_dir }}/root_ca.crt"
  when: not root_ca_cert_stat.stat.exists
  changed_when: not root_ca_cert_stat.stat.exists
  tags:
    - container_server

- name: Ensure root CA key/cert ownership (unconditional -- self-heals files
    left root-owned by an earlier run of this role, before this fix existed)
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ step_ca_server_actual_uid }}"
    group: "{{ step_ca_server_actual_gid }}"
  loop:
    - "{{ step_ca_server_data_dir }}/root_ca.key"
    - "{{ step_ca_server_data_dir }}/root_ca.crt"
  tags:
    - container_server


- name: Check if ca.json already exists
  ansible.builtin.stat:
    path: "{{ step_ca_server_data_dir }}/config/ca.json"
  register: ca_json_stat
  tags:
    - container_server

- name: Create local temp directory for JWK provisioner key generation
  ansible.builtin.tempfile:
    state: directory
    suffix: step_ca_jwk
  register: _jwk_tempdir
  delegate_to: localhost
  become: false
  tags:
    - container_server

- name: Write provisioner password to a temp file (step CLI requires a file, not stdin, for --password-file)
  ansible.builtin.copy:
    content: "{{ step_ca_server_provisioner_password }}"
    dest: "{{ _jwk_tempdir.path }}/provisioner.pass"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - container_server

- name: Generate provisioner JWK keypair (step CLI runs on the control node -- it is not installed on the target host)
  ansible.builtin.command:
    cmd: >-
      step crypto jwk create
      {{ _jwk_tempdir.path }}/pub.json
      {{ _jwk_tempdir.path }}/priv.json
      --kty EC --crv P-256 --use sig
      --password-file {{ _jwk_tempdir.path }}/provisioner.pass
      --force
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  tags:
    - container_server

- name: Read generated public JWK
  ansible.builtin.slurp:
    src: "{{ _jwk_tempdir.path }}/pub.json"
  register: _jwk_pub_raw
  delegate_to: localhost
  become: false
  tags:
    - container_server

- name: Read generated encrypted private JWK (JWE JSON serialization)
  ansible.builtin.slurp:
    src: "{{ _jwk_tempdir.path }}/priv.json"
  register: _jwk_priv_raw
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - container_server

- name: Parse JWK files and build the JWE compact serialization step-ca expects in encryptedKey
  ansible.builtin.set_fact:
    _provisioner_jwk_pub: "{{ _jwk_pub_raw.content | b64decode | from_json }}"
    _provisioner_jwk_priv: "{{ _jwk_priv_raw.content | b64decode | from_json }}"
  no_log: true
  tags:
    - container_server

- name: "Build encryptedKey (RFC 7516 compact serialization: protected.encrypted_key.iv.ciphertext.tag)"
  ansible.builtin.set_fact:
    _provisioner_encrypted_key: >-
      {{ _provisioner_jwk_priv.protected }}.{{ _provisioner_jwk_priv.encrypted_key }}.{{ _provisioner_jwk_priv.iv }}.{{ _provisioner_jwk_priv.ciphertext }}.{{ _provisioner_jwk_priv.tag }}
  no_log: true
  tags:
    - container_server

- name: Remove local temp directory
  ansible.builtin.file:
    path: "{{ _jwk_tempdir.path }}"
    state: absent
  delegate_to: localhost
  become: false
  tags:
    - container_server

- name: Create config subdirectory (smallstep image's entrypoint hardcodes
    $STEPPATH/config/ca.json as the lookup location; everything else in
    ca.json's own content stays flat under $STEPPATH, which it already
    correctly references)
  ansible.builtin.file:
    path: "{{ step_ca_server_data_dir }}/config"
    state: directory
    owner: "{{ step_ca_server_service_user }}"
    group: "{{ step_ca_server_service_group }}"
    mode: "0700"
  tags:
    - container_server

- name: Render ca.json configuration from template
  ansible.builtin.template:
    src: ca.json.j2
    dest: "{{ step_ca_server_data_dir }}/config/ca.json"
    owner: "{{ step_ca_server_service_user }}"
    group: "{{ step_ca_server_service_group }}"
    mode: "0600"
  no_log: true
  tags:
    - container_server

- name: Create secrets subdirectory
  ansible.builtin.file:
    path: "{{ step_ca_server_data_dir }}/secrets"
    state: directory
    owner: "{{ step_ca_server_service_user }}"
    group: "{{ step_ca_server_service_group }}"
    mode: "0700"
  tags:
    - container_server

- name: Write root key password file (root_ca.key is unencrypted, but the
    step-ca binary unconditionally reads $STEPPATH/secrets/password at
    startup and fails outright -- "error reading .../secrets/password" --
    if it doesn't exist, regardless of whether the referenced key actually
    needs a passphrase)
  ansible.builtin.copy:
    content: "{{ step_ca_server_provisioner_password }}"
    dest: "{{ step_ca_server_data_dir }}/secrets/password"
    owner: "{{ step_ca_server_service_user }}"
    group: "{{ step_ca_server_service_group }}"
    mode: "0600"
  no_log: true
  tags:
    - container_server

- name: Start/restart step-ca container
  community.docker.docker_container:
    name: "{{ step_ca_server_container_name }}"
    image: "{{ step_ca_server_image }}"
    state: started
    restart_policy: unless-stopped
    user: "{{ step_ca_server_actual_uid }}:{{ step_ca_server_actual_gid }}"
    cap_drop:
      - ALL
    capabilities:
      # NET_BIND_SERVICE is required because ca.json's api.address binds to
      # 0.0.0.0:443 (a privileged port < 1024) and the container runs as a
      # non-root uid. Without this, the kernel refuses to exec the step-ca
      # binary at all ("Operation not permitted") because the binary's file
      # capabilities can't be honored once cap_drop: ALL has stripped this
      # capability from the process's bounding set.
      - NET_BIND_SERVICE
    # The smallstep/step-ca image ships a built-in HEALTHCHECK that runs
    # `step ca health`, which requires --ca-url to be configured in the
    # step CLI's environment -- it isn't, so the check always exits 1 and
    # Docker reports the container as (unhealthy) even when step-ca is
    # serving requests normally. Override with a direct curl to /health,
    # which returns {"status":"ok"} (confirmed live) and needs no config.
    healthcheck:
      # -k skips TLS verification: curl inside the container has no
      # truststore for the step-ca root, so -sf alone exits 60.
      # Loopback health check -- skipping cert check is acceptable.
      test: ["CMD-SHELL", "curl -sfk https://localhost:443/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "{{ step_ca_server_https_port }}:443"
    volumes:
      - "{{ step_ca_server_data_dir }}:/home/step"
    env:
      STEP_CA_USE_DEFAULT_TLS: "false"
  tags:
    - container_server

- name: Read root CA certificate into fact
  ansible.builtin.slurp:
    src: "{{ step_ca_server_data_dir }}/root_ca.crt"
  register: root_ca_cert_content
  tags:
    - container_server

- name: Set step_ca_server_root_ca_cert fact
  ansible.builtin.set_fact:
    step_ca_server_root_ca_cert: "{{ root_ca_cert_content.content | b64decode }}"
  tags:
    - container_server

# openssl fingerprint output is colon-separated uppercase hex. The step CLI
# and step-ca use lowercase with no separators for the same value (matches
# step-ca own startup log line, X.509 Root Fingerprint). The two are not
# interchangeable for step ca bootstrap --fingerprint, so the openssl
# output is reformatted below (strip colons, lowercase) before use.
- name: Extract CA fingerprint (SHA-256)
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in "{{ step_ca_server_data_dir }}/root_ca.crt" \
      -noout -fingerprint -sha256 \
      | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f'
  args:
    executable: /bin/bash
  register: ca_fingerprint_output
  changed_when: false
  tags:
    - container_server

- name: Set step_ca_server_ca_fingerprint fact
  ansible.builtin.set_fact:
    step_ca_server_ca_fingerprint: "{{ ca_fingerprint_output.stdout }}"
  tags:
    - container_server

- name: Container server convergence complete
  ansible.builtin.debug:
    msg: |
      container_server role complete.
      Root CA initialized, container running, facts exposed to caller.
        - step_ca_server_root_ca_cert: Root CA certificate (PEM)
        - step_ca_server_ca_fingerprint: SHA-256 fingerprint (TOFU bootstrap)
  tags:
    - container_server
